    <script>
        // 🔔 新增：通知功能
document.addEventListener('DOMContentLoaded', function() {
    const notificationPanel = document.getElementById('notification-panel');
    const enableBtn = document.getElementById('enable-notifications');
    const skipBtn = document.getElementById('skip-notifications');

    // 檢查瀏覽器支援
    if (!('Notification' in window)) {
        console.log('此瀏覽器不支持通知功能');
        return;
    }

    // 檢查權限狀態
    function checkNotificationPermission() {
        if (Notification.permission === 'default') {
            // 首次訪問，顯示通知請求面板
            setTimeout(() => {
                notificationPanel.style.display = 'block';
            }, 5000); // 5秒後顯示
        } else if (Notification.permission === 'granted') {
            console.log('通知權限已授予');
            scheduleNotifications();
        }
    }

    // 啟用通知
    enableBtn.addEventListener('click', function() {
        Notification.requestPermission().then(permission => {
            if (permission === 'granted') {
                notificationPanel.style.display = 'none';
                showWelcomeNotification();
                scheduleNotifications();
                
                // GA4 事件追蹤
                if (typeof gtag !== 'undefined') {
                    gtag('event', 'notification_enabled', {
                        label: '用戶啟用通知功能'
                    });
                }
                
                console.log('通知功能已啟用');
            }
        });
    });

    // 跳過通知
    skipBtn.addEventListener('click', function() {
        notificationPanel.style.display = 'none';
        localStorage.setItem('notificationSkipped', 'true');
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'notification_skipped', {
                label: '用戶跳過通知啟用'
            });
        }
        
        console.log('用戶跳過通知啟用');
    });

    // 顯示歡迎通知
    function showWelcomeNotification() {
        if (Notification.permission === 'granted') {
            const notification = new Notification('TQC AI 測驗系統', {
                body: '🔔 測驗提醒已啟用！我們會定期提醒您進行練習。',
                icon: '/TQC_AI_TEST/icon.png',
                badge: '/TQC_AI_TEST/badge.png'
            });
            
            // 3秒後自動關閉通知
            setTimeout(() => {
                notification.close();
            }, 3000);
        }
    }

    // 安排定期通知
    function scheduleNotifications() {
        console.log('開始安排定期通知...');
        // 這裡先建立基礎結構，詳細邏輯後續補充
    }

    // 檢查是否已經跳過通知
    if (!localStorage.getItem('notificationSkipped')) {
        checkNotificationPermission();
    }

    // 記錄用戶訪問時間
    localStorage.setItem('lastVisit', new Date().getTime());
});
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TQC人工智慧應用與技術測驗</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="mode-not-selected">
    <!-- 通知權限請求和推播功能 -->
    <div class="notification-panel" id="notification-panel" style="display: none;">
        <div class="notification-request">
            <p>🔔 開啟測驗提醒通知，定期接收學習提醒！</p>
            <div class="notification-buttons">
                <button class="btn-primary" id="enable-notifications">啟用通知</button>
                <button class="btn-secondary" id="skip-notifications">稍後再說</button>
            </div>
        </div>
    </div>

    <!-- 自定義提示框 -->
    <div class="custom-alert" id="custom-alert">
        <div class="alert-content">
            <div class="alert-title" id="alert-title">提示</div>
            <div class="alert-message" id="alert-message"></div>
            <div class="alert-buttons">
                <button class="alert-btn confirm" id="alert-confirm">確定</button>
                <button class="alert-btn cancel" id="alert-cancel" style="display: none;">取消</button>

        </div>
    </div>

            </div>
            <div class="modal-body" id="analysis-content">
                <!-- 分析內容將由JS生成 -->
            </div>

                <button class="btn-primary" id="close-analysis-btn">關閉</button>

    </div>

    <!-- 自定義測驗模態框 -->

        <div class="modal-content">

                <h2>🎯 自定義測驗</h2>
                <span class="close" id="close-custom-quiz">&times;</span>

            <div class="modal-body">

                        <input type="text" id="quiz-title" placeholder="輸入測驗標題" value="自定義測驗">

                    <div class="form-group">
                        <label>題目數量</label>
                        <input type="number" id="quiz-quantity" min="5" max="72" value="20">
                    </div>
                    
                    <div class="form-group">
                        <label>測驗時間（分鐘）</label>
                        <input type="number" id="quiz-time" min="5" max="120" value="30">
                    </div>
                    
                    <div class="form-group">
                        <label>選擇題目類別</label>
                        <div class="category-checkboxes">
                            <label class="checkbox-label">
                                <input type="checkbox" id="category1-check" checked> 
                                第一類：AI 發展歷程與生態系
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="category2-check" checked> 
                                第二類：AI 應用領域與產業發展

                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>題目難度篩選</label>
                        <div class="difficulty-options">
                            <label class="radio-label">
                                <input type="radio" name="difficulty" value="all" checked> 
                                全部題目

                            <label class="radio-label">
                                <input type="radio" name="difficulty" value="weakness"> 
                                弱點題目
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="difficulty" value="unanswered"> 
                                未答題目
                            </label>

                    </div>

                        <h4>測驗預覽</h4>
                        <div id="preview-content">選擇設定後將顯示預覽</div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="preview-quiz">更新預覽</button>
                <button class="btn-primary" id="start-custom-quiz">開始測驗</button>
            </div>
        </div>
    </div>

    <!-- 智慧錯題本模態框 -->
    <div class="modal" id="wrong-questions-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📚 智慧錯題本</h2>
                <span class="close" id="close-wrong-questions">&times;</span>
            </div>
            <div class="modal-body">
                <div class="wrong-questions-panel">
                    <h3>🎯 錯題分析與複習</h3>
                    
                    <!-- 統計資訊 -->
                    <div class="wrong-questions-stats" id="wrong-questions-stats">
                        <!-- 統計數據將由JS生成 -->
                    </div>
                    
                    <!-- 篩選器 -->
                    <div class="wrong-questions-filter" id="wrong-questions-filter">
                        <button class="filter-btn active" data-filter="all">全部錯題</button>
                        <button class="filter-btn" data-filter="category1">AI發展歷程</button>
                        <button class="filter-btn" data-filter="category2">AI應用領域</button>
                        <button class="filter-btn" data-filter="recent">最近錯誤</button>
                        <button class="filter-btn" data-filter="frequent">頻繁錯誤</button>
                    </div>
                    
                    <!-- 錯題列表 -->
                    <div class="wrong-questions-list" id="wrong-questions-list">
                        <!-- 錯題列表將由JS生成 -->
                    </div>
                    
                    <!-- 操作按鈕 -->
                    <div class="wrong-questions-actions">
                        <button class="wrong-questions-btn secondary" id="export-wrong-questions">
                            📥 匯出錯題
                        </button>
                        <button class="wrong-questions-btn primary" id="start-wrong-questions-training">
                            🎯 專項練習
                        </button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="close-wrong-questions-btn">關閉</button>
            </div>
        </div>
    </div>

    <!-- 題庫瀏覽模態框 -->
<div class="modal" id="question-bank-modal">
    <div class="modal-content" style="max-width: 900px;">
        <div class="modal-header">
            <h2>📖 題庫瀏覽</h2>
            <span class="close" id="close-question-bank">&times;</span>
        </div>
        <div class="modal-body">
            <div class="question-bank-panel">
                <!-- 搜尋和篩選區域 -->
                <div class="question-bank-filter">
                    <div class="search-box">
                        <input type="text" id="question-search" placeholder="搜尋題目內容..." style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                    </div>
                    <div class="filter-options">
                        <label class="checkbox-label">

    <!-- 新增功能按鈕區域 -->

    <!-- 添加主要內容錨點 -->

                <div class="result-panel" id="result-panel" style="display: none;">
                    <h3>測驗結果</h3>
                    <div id="result-content"></div>

            </div>
            
            <div class="question-detail">
                <div class="question-header">
                    <div class="question-number" id="current-question">題目 1-01</div>
                </div>
                
                <div class="question-text" id="question-text">

                </div>

                <div class="navigation">

                    <!-- 新增：第一類完成交卷按鈕 -->
                    <button class="category-submit-btn" id="category1-submit-btn" style="display: none;">

                    </button>
                    
                    <!-- 弱點訓練按鈕 -->
                    <button class="weakness-mode-btn" id="weakness-mode-btn" style="display: none;">
                        🎯 弱點訓練模式
                    </button>
                    
                    <!-- 模擬考專用提交按鈕 -->
                    <button class="exam-submit-btn" id="exam-submit-btn" style="display: none;">提前交卷</button>
                    
                    <!-- 模擬考專用再考一次按鈕 -->
                    <button class="exam-retry-btn" id="exam-retry-btn" style="display: none;">再考一次</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 🔹 GA4 自訂事件追蹤整合最終版 -->
<script>
document.addEventListener("DOMContentLoaded", function() {

    // 🧭 模式切換
    const practiceMode = document.getElementById("practice-mode");
    const examMode = document.getElementById("exam-mode");

    if (practiceMode) {
        practiceMode.addEventListener("click", function() {
            gtag('event', 'switch_mode', {
                mode: 'practice',
                label: '切換至練習模式'
            });
        });
    }

    if (examMode) {
        examMode.addEventListener("click", function() {
            gtag('event', 'switch_mode', {
                mode: 'exam',
                label: '切換至模擬考模式'
            });
        });
    }

    // 🎯 自定義測驗
    const customQuizBtn = document.getElementById("custom-quiz-btn");
    const startCustomQuiz = document.getElementById("start-custom-quiz");

    if (customQuizBtn) {
        customQuizBtn.addEventListener("click", function() {
            gtag('event', 'open_custom_quiz', {
                label: '開啟自定義測驗視窗'
            });
        });
    }

    if (startCustomQuiz) {
        startCustomQuiz.addEventListener("click", function() {
            const title = document.getElementById("quiz-title")?.value || "未命名測驗";
            const quantity = document.getElementById("quiz-quantity")?.value || 0;
            const time = document.getElementById("quiz-time")?.value || 0;

            gtag('event', 'start_custom_quiz', {
                label: '開始自定義測驗',
                quiz_title: title,
                question_count: parseInt(quantity),
                time_limit_min: parseInt(time)
            });
        });
    }

    // 📊 學習分析報告
    const analysisBtn = document.getElementById("analysis-btn");
    if (analysisBtn) {
        analysisBtn.addEventListener("click", function() {
            gtag('event', 'open_learning_analysis', {
                label: '開啟學習分析報告'
            });
        });
    }

    // 📚 智慧錯題本
    const wrongQuestionsBtn = document.getElementById("wrong-questions-btn");
    if (wrongQuestionsBtn) {
        wrongQuestionsBtn.addEventListener("click", function() {
            gtag('event', 'open_wrong_questions', {
                label: '開啟智慧錯題本'
            });
        });
    }

    // 📖 題庫瀏覽
    const questionBankBtn = document.getElementById("question-bank-btn");
    if (questionBankBtn) {
        questionBankBtn.addEventListener("click", function() {
            gtag('event', 'open_question_bank', {
                label: '開啟題庫瀏覽'
            });
        });
    }

    // 🎯 弱點訓練模式
    const weaknessBtn = document.getElementById("weakness-training-btn");
    if (weaknessBtn) {
        weaknessBtn.addEventListener("click", function() {
            gtag('event', 'start_weakness_training', {
                label: '開始弱點訓練'
            });
        });
    }

    // ✅ 練習模式提交答案
    const submitBtn = document.getElementById("submit-btn");
    if (submitBtn) {
        submitBtn.addEventListener("click", function() {
            const score = document.getElementById("score")?.innerText || "0";
            const progress = document.getElementById("progress")?.innerText || "0/0";
            
            gtag('event', 'submit_practice', {
                label: '提交練習題',
                mode: 'practice',
                score: parseFloat(score),
                progress: progress
            });
        });
    }

    // ✅ 模擬考提交（包含分數與作答時間）
    const examSubmit = document.getElementById("exam-submit-btn");
    if (examSubmit) {
        examSubmit.addEventListener("click", function() {
            const score = document.getElementById("score")?.innerText || "0";
            const timeDisplay = document.getElementById("time-display")?.innerText || "0:00";

            // 將「分鐘:秒」轉成總秒數
            const [min, sec] = timeDisplay.split(":").map(Number);
            const timeSpentSec = (min * 60) + sec;

            gtag('event', 'submit_exam', {
                label: '提交模擬考',
                mode: 'exam',
                score: parseFloat(score),
                time_spent_sec: timeSpentSec
            });
        });
    }

});
</script>
